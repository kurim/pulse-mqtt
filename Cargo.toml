[package]
name = "pulsemqtt"
version = "2026.11.3"
edition = "2024"

[dependencies]
adlx-lite = "1.0.0"
libloading = "0.9.1"
minisign-verify = "0.3.0"
nvml-wrapper = "0.13.0"
rumqttd = { version = "0.20.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sysinfo = "0.40.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Optimised for size: the app does little work once a second.
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[[example]]
name = "sign"
test = true # run its tests together with the others

[dev-dependencies]
minisign = "0.10.0"
rumqttc = { version = "0.25.1", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"
